<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True xe mô hình</title>
<meta name="description" content="True xe mô hình: xe mô hình 1:64 Mini GT, Kaido House, Poprace, Xe Mica và nhiều hãng khác. Đặt hàng nhanh qua Zalo.">
<meta property="og:title" content="True xe mô hình">
<meta property="og:description" content="Xe mô hình 1:64 Mini GT, Kaido House, Poprace, Xe Mica. Đặt hàng nhanh qua Zalo.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏁%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--base:#fff7fb;--b1:#ff9ccd;--b2:#ffe45c;--b3:#6ee7c8;--b4:#9db8ff;--ink:#14122B;--card:#fff;--mut:#4b4a66;--y:#FFC400;--pk:#E0246A;--ok:#0b7a43;--bad:#c4271c;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--base:#150f33;--b1:#7a1d5c;--b2:#6b5a00;--b3:#0d5c52;--b4:#233f9c;--ink:#fff;--card:#241d4f;--mut:#c4c2e8;--ok:#5fe0a0;--bad:#ff8f86}}
:root[data-theme="dark"]{--base:#150f33;--b1:#7a1d5c;--b2:#6b5a00;--b3:#0d5c52;--b4:#233f9c;--ink:#fff;--card:#241d4f;--mut:#c4c2e8;--ok:#5fe0a0;--bad:#ff8f86}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--base);color:var(--ink);font:16px/1.5 'Be Vietnam Pro',system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 10% 6%,var(--b1),transparent 40%),radial-gradient(circle at 92% 10%,var(--b2),transparent 36%),radial-gradient(circle at 85% 88%,var(--b3),transparent 40%),radial-gradient(circle at 6% 92%,var(--b4),transparent 42%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.1;background:radial-gradient(var(--ink) 1.3px,transparent 1.6px) 0 0/24px 24px}
.wrap{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 70px)}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:4px 4px 0 var(--ink)}
.top .cur{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:800 1.15rem 'Baloo 2',sans-serif}
button,.btn{font:600 15px 'Be Vietnam Pro',sans-serif;border:3px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:4px solid var(--pk);outline-offset:2px}
.top button,.top .btn{box-shadow:none}
.burger{display:flex;align-items:center;gap:8px;background:var(--y);color:#14122B;border-color:#14122B}
.burger s{display:block;width:18px;height:14px;background:linear-gradient(#14122B 0 0) 0 0/100% 3px,linear-gradient(#14122B 0 0) 0 50%/100% 3px,linear-gradient(#14122B 0 0) 0 100%/100% 3px;background-repeat:no-repeat}
.zl{background:#0068FF;color:#fff;border-color:#14122B}
.flag{height:26px;margin-top:16px;border:3px solid var(--ink);border-radius:8px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/26px 26px}
h1{font:800 clamp(2.6rem,11vw,5.2rem)/.95 'Baloo 2',sans-serif;margin:22px 0 0;text-shadow:4px 4px 0 var(--y),8px 8px 0 var(--pk)}
.tag{margin:16px 0 0;max-width:600px;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(10,8,30,.55);z-index:40;display:none}
.scrim.open{display:block}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);z-index:50;background:var(--card);border-right:3px solid var(--ink);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overflow-y:auto;transform:translateX(-105%);transition:transform .2s;visibility:hidden}
#dr.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dh b{font:800 1.5rem 'Baloo 2',sans-serif}
.ci{display:flex;width:100%;align-items:center;gap:10px;margin-bottom:10px;text-align:left;box-shadow:3px 3px 0 var(--ink)}
.ci i{width:16px;height:16px;border-radius:50%;background:var(--bc);border:2px solid var(--ink);flex:none}
.ci span{flex:1}.ci b{font-size:13px;opacity:.75}
.ci.on{background:var(--bc);color:var(--bf)}.ci.on i{background:var(--bf)}
.cr{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.cr input[type=color]{width:42px;padding:2px;height:40px;flex:none}
.cr input[type=text]{flex:1;min-width:0}
.cr button{padding:5px 10px;box-shadow:none}
.admin{background:var(--y);color:#14122B;padding:12px;border:3px solid #14122B;border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;box-shadow:4px 4px 0 #14122B}
.admin span{flex:1 1 220px;font-weight:600;font-size:14px}
.admin button{background:#fff;color:#14122B;border-color:#14122B;box-shadow:3px 3px 0 #14122B}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.tb input{flex:1 1 220px;min-width:0}.tb select{flex:0 1 190px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;width:100%}
.ct{font:800 1.7rem 'Baloo 2',sans-serif;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
.ct i{width:20px;height:20px;border-radius:50%;background:var(--bc);border:3px solid var(--ink)}
.ct small{font:600 15px 'Be Vietnam Pro';color:var(--mut)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:22px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.cb{background:var(--bc);color:var(--bf);padding:6px 12px;border-bottom:3px solid var(--ink);font:800 1.05rem 'Baloo 2',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bc) 24%,transparent) 0 12px,transparent 12px 24px);display:grid;place-items:center;overflow:hidden;border-bottom:3px solid var(--ink);position:relative}
.pic img{width:100%;height:100%;object-fit:cover}.pic svg{width:72%}
.out .pic>*{filter:grayscale(1);opacity:.5}
.out .pic::after{content:"Hết hàng";position:absolute;font:800 1.5rem 'Baloo 2',sans-serif;background:var(--ink);color:var(--card);padding:0 14px;border-radius:8px;transform:rotate(-8deg)}
.b{padding:12px 14px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
h3{font:800 1.3rem/1.1 'Baloo 2',sans-serif;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips i{font-style:normal;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:0 9px}
.d{margin:0;color:var(--mut);font-size:14px;flex:1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{font:800 1.5rem 'Baloo 2',sans-serif}
.stk{font-size:14px;font-weight:600;color:var(--ok)}.stk.low{color:#b26a00}.stk.zero{color:var(--bad)}
.b>.zl{width:100%}.b>button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.acts{display:flex;gap:6px}.acts button{flex:1;padding:6px 8px}
.empty{grid-column:1/-1;border:3px dashed var(--ink);padding:34px;text-align:center;border-radius:16px;background:var(--card)}
.more{display:block;margin:26px auto 0}
.foot{margin-top:36px;padding:14px 16px;border:3px dashed var(--ink);border-radius:16px;background:var(--card);font-size:14px;text-align:center}
dialog{border:3px solid var(--ink);border-radius:18px;background:var(--base);color:var(--ink);padding:18px;width:min(540px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,8,30,.6)}
dialog h2{font:800 1.9rem 'Baloo 2',sans-serif;margin:0 0 6px}
label{display:block;font-weight:600;font-size:14px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.pri{background:var(--y);color:#14122B;border-color:#14122B}
#prev{max-width:140px;margin-top:8px;border:3px solid var(--ink);border-radius:10px;display:none}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:600;display:none;max-width:90vw;z-index:99}
@media (prefers-reduced-motion:reduce){#dr{transition:none}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Trang cần bật JavaScript để hiển thị danh sách xe.</p></noscript>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>
<dialog id="ed"><form method="dialog" id="f">
<h2 id="edt">Thêm xe</h2>
<label for="fb">Danh mục (hãng)</label><select id="fb"></select>
<label for="fn">Tên xe</label><input id="fn" required placeholder="Nissan GT-R R35">
<div class="g2"><div><label for="fs">Kiểu mẫu</label><input id="fs" placeholder="Chase, V1, Pandem..."></div>
<div><label for="fc">Màu</label><input id="fc" placeholder="Xanh dương"></div></div>
<div class="g2"><div><label for="fp">Giá (đ)</label><input id="fp" type="number" min="0" step="1000" required></div>
<div><label for="fq">Số lượng</label><input id="fq" type="number" min="0" step="1" required></div></div>
<label for="fd">Thông tin chi tiết</label><textarea id="fd" rows="3" placeholder="Chi tiết mở cửa, tình trạng hộp, trầy xước..."></textarea>
<div class="g2"><div><label for="fcol">Màu xe (khi chưa có ảnh)</label><input id="fcol" type="color" value="#3366cc"></div>
<div><label for="fi">Ảnh xe</label><input id="fi" type="file" accept="image/*"></div></div>
<img id="prev" alt="Ảnh xem trước">
<div class="dl"><button type="button" id="fx" style="color:var(--bad)">Xóa xe</button><span><button type="button" id="fc2">Hủy</button> <button class="pri">Lưu</button></span></div>
</form></dialog>

<dialog id="sd"><form method="dialog" id="sf">
<h2>Sửa chữ trên web</h2>
<label for="sn">Tên shop</label><input id="sn" required>
<label for="sl">Câu giới thiệu dưới tên shop</label><textarea id="sl" rows="2"></textarea>
<div class="g2"><div><label for="sz">Số Zalo nhận đơn</label><input id="sz" inputmode="tel" required></div>
<div><label for="sb">Chữ trên nút đặt hàng</label><input id="sb" required></div></div>
<label for="sf2">Ghi chú cuối trang (để trống nếu không cần)</label><textarea id="sf2" rows="2"></textarea>
<div class="dl"><span></span><span><button type="button" id="sc">Hủy</button> <button class="pri">Lưu</button></span></div>
</form></dialog>

<dialog id="bd"><form method="dialog" id="bf">
<h2>Nhập nhiều xe cùng lúc</h2>
<p class="hint">Mỗi dòng một xe, các cột cách nhau bằng dấu | (hoặc dán từ Excel): Danh mục | Tên xe | Kiểu mẫu | Màu | Giá | Số lượng. Danh mục chưa có sẽ tự được tạo. Ảnh thêm sau bằng nút Sửa.</p>
<textarea id="bt" rows="9" placeholder="Mini GT | Nissan GT-R R35 | Chase | Xanh | 220000 | 3&#10;Kaido House | Datsun 510 | V1 | Cam | 480000 | 2"></textarea>
<div class="dl"><span></span><span><button type="button" id="bc">Hủy</button> <button class="pri">Thêm các xe này</button></span></div>
</form></dialog>
<script>
const PAGE=24,PAL=['#E4262C','#FF7A00','#FFC400','#19C47E','#1E6BFF','#8B3DFF','#E0246A','#00B8D9'];
const ADMIN=new URLSearchParams(location.search).has('admin');
const DEF={shop:{name:'True xe mô hình',tag:'Mini GT, Kaido House, Poprace, Xe Mica và nhiều hãng khác. Thích xe nào cứ nhắn Zalo để chốt đơn.',zalo:'0938532762',btn:'Đặt qua Zalo',foot:'Giá và số lượng có thể thay đổi. Nhắn Zalo để xác nhận trước khi chuyển khoản.'},cats:[{n:'Mini GT',c:'#E4262C'},{n:'Kaido House',c:'#FFC400'},{n:'Poprace',c:'#1E6BFF'},{n:'Xe Mica',c:'#19C47E'},{n:'Khác',c:'#8B3DFF'}],items:[]};
let S=null,SITE=null,B={},urls={},draft=false,edit=ADMIN,brand='all',q='',sort='new',shown=PAGE,dopen=false,cur=null,imgPath='',newBlob=null,T,delArm=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
const fg=h=>{const n=parseInt(h.slice(1),16);return (.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255>.6?'#14122B':'#fff'};
const cat=n=>S.cats.find(c=>c.n===n);
const zl=()=>'https://zalo.me/'+String(S.shop.zalo).replace(/\D/g,'');
const cnt=b=>b==='all'?S.items.length:S.items.filter(i=>i.brand===b).length;
const src=p=>B[p]?(urls[p]||(urls[p]=URL.createObjectURL(B[p]))):p;
const st=m=>{const e=$('#st');if(e)e.textContent=m};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function car(h){return `<svg viewBox="0 0 120 50" aria-hidden="true"><path d="M8 34c0-5 3-7 9-8l14-10c3-2 6-3 10-3h26c5 0 9 2 13 5l12 7c7 1 10 3 10 9v3H8z" fill="${esc(h||'#888')}" stroke="#14122B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="34" cy="38" r="8" fill="#14122B"/><circle cx="90" cy="38" r="8" fill="#14122B"/><circle cx="34" cy="38" r="3" fill="#ddd"/><circle cx="90" cy="38" r="3" fill="#ddd"/></svg>`}

/* Bản nháp lưu trên máy chủ shop (IndexedDB), chỉ dùng ở chế độ quản lý */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('truexe',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=async(m,k,v)=>{const d=await idb();return new Promise((ok,no)=>{const s=d.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),r=m==='get'?s.get(k):m==='set'?s.put(v,k):s.delete(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
function save(){
  if(!ADMIN)return;draft=true;st('Đang lưu nháp...');clearTimeout(T);
  T=setTimeout(()=>kv('set','draft',{S,B}).then(()=>st('Đã lưu nháp trên máy này. Xong thì bấm "Tải bản cập nhật".')).catch(()=>st('Không lưu nháp được.')),400);
}

async function init(){
  $('#app').innerHTML='<p class="tag" style="padding:30px 0">Đang tải danh sách xe...</p>';
  try{const r=await fetch('data.json',{cache:'no-cache'});if(!r.ok)throw 0;SITE=await r.json()}catch(e){}
  if(ADMIN){try{const d=await kv('get','draft');if(d&&d.S){S=d.S;B=d.B||{};draft=true}}catch(e){}}
  if(!S)S=SITE||(ADMIN?JSON.parse(JSON.stringify(DEF)):null);
  if(!S){$('#app').innerHTML='<p class="tag" style="padding:30px 0">Chưa tải được danh sách xe. Bạn thử tải lại trang giúp mình nhé.</p>';return}
  S.items.forEach(i=>{if(!cat(i.brand))S.cats.push({n:i.brand,c:PAL[S.cats.length%8]})});
  document.title=S.shop.name;render();
}
function setD(v){dopen=v;$('#dr').classList.toggle('open',v);$('#sc2').classList.toggle('open',v);$('#mn').setAttribute('aria-expanded',v)}
function pick(b){brand=b;shown=PAGE;q='';dopen=false;render();window.scrollTo(0,0)}

function render(){
  const c=cat(brand);
  $('#app').innerHTML=`<div class="top"><button class="burger" id="mn" aria-expanded="false" aria-controls="dr"><s></s>Danh mục</button>
  <span class="cur">${brand==='all'?'Tất cả xe':esc(brand)}</span><a class="btn zl" href="${esc(zl())}" target="_blank" rel="noopener">Zalo</a></div>
  <aside id="dr" aria-label="Danh mục"><div class="dh"><b>Danh mục</b><button id="cl" aria-label="Đóng menu">Đóng</button></div>
  <button class="ci ${brand==='all'?'on':''}" style="--bc:#14122B;--bf:#fff" data-b="all"><i></i><span>Tất cả</span><b>${cnt('all')}</b></button>
  ${S.cats.map((k,x)=>edit?`<div class="cr"><input type="color" value="${k.c}" data-ci="${x}" aria-label="Màu danh mục"><input type="text" value="${esc(k.n)}" data-cn="${x}" aria-label="Tên danh mục"><button data-cv="${x}">${cnt(k.n)}</button><button data-cd="${x}" aria-label="Xóa danh mục">Xóa</button></div>`
  :`<button class="ci ${brand===k.n?'on':''}" style="--bc:${k.c};--bf:${fg(k.c)}" data-b="${esc(k.n)}"><i></i><span>${esc(k.n)}</span><b>${cnt(k.n)}</b></button>`).join('')}
  ${edit?'<button id="ac" class="pri">Thêm danh mục</button><p class="hint">Bấm số xe để xem danh mục. Chỉ xóa được danh mục đã trống.</p>':''}</aside><div class="scrim" id="sc2"></div>
  <div class="flag"></div><h1>${esc(S.shop.name)}</h1><p class="tag">${esc(S.shop.tag)}</p>
  ${ADMIN?`<div class="admin"><span>${edit?'Chế độ quản lý: mọi thay đổi chỉ lưu trên máy này cho đến khi bạn tải bản cập nhật và đưa lên GitHub. Khách không thấy phần này.':'Đang xem như khách.'}${draft?' Có bản nháp chưa đăng.':''}</span>${edit?'<button id="add">Thêm xe</button><button id="bulk">Nhập nhiều xe</button><button id="set">Sửa chữ trên web</button><button id="exp" class="pri">Tải bản cập nhật (.zip)</button><button id="clr">Xóa bản nháp</button>':''}<button id="tg">${edit?'Xem như khách':'Quay lại chỉnh sửa'}</button><span id="st"></span></div>`:''}
  <div class="tb"><input type="search" id="q" placeholder="Tìm tên xe, màu, kiểu mẫu..." aria-label="Tìm xe" value="${esc(q)}">
  <select id="so" aria-label="Sắp xếp"><option value="new">Mới thêm trước</option><option value="asc">Giá thấp đến cao</option><option value="desc">Giá cao đến thấp</option></select></div>
  <div class="ct" style="--bc:${c?c.c:'#14122B'}"><i></i>${brand==='all'?'Tất cả xe':esc(brand)} <small id="n"></small></div>
  <main id="grid"></main><button class="more" id="mo" style="display:none">Xem thêm xe</button>
  ${S.shop.foot?`<div class="foot">${esc(S.shop.foot)}</div>`:''}`;
  $('#so').value=sort;
  $('#mn').onclick=()=>setD(true);$('#cl').onclick=()=>setD(false);$('#sc2').onclick=()=>setD(false);
  $('#q').oninput=e=>{q=e.target.value.toLowerCase();shown=PAGE;grid()};
  $('#so').onchange=e=>{sort=e.target.value;shown=PAGE;grid()};
  $('#mo').onclick=()=>{shown+=PAGE;grid()};
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>pick(b.dataset.b));
  if(ADMIN){$('#tg').onclick=()=>{edit=!edit;render()};
    if(edit){$('#add').onclick=()=>openEd(null);$('#bulk').onclick=()=>{$('#bt').value='';$('#bd').showModal()};$('#set').onclick=openSet;$('#exp').onclick=exp;$('#clr').onclick=clr;catEdit()}}
  grid();
}
function catEdit(){
  $('#ac').onclick=()=>{let n=1;while(cat('Danh mục '+n))n++;S.cats.push({n:'Danh mục '+n,c:PAL[S.cats.length%8]});save();render();setD(true)};
  document.querySelectorAll('[data-ci]').forEach(e=>e.onchange=()=>{S.cats[e.dataset.ci].c=e.value;save();render();setD(true)});
  document.querySelectorAll('[data-cn]').forEach(e=>e.onchange=()=>{const k=S.cats[e.dataset.cn],v=e.value.trim();
    if(!v||(cat(v)&&cat(v)!==k)){toast('Tên danh mục trống hoặc bị trùng.');render();setD(true);return}
    S.items.forEach(i=>{if(i.brand===k.n)i.brand=v});if(brand===k.n)brand=v;k.n=v;save();render();setD(true)});
  document.querySelectorAll('[data-cv]').forEach(e=>e.onclick=()=>pick(S.cats[e.dataset.cv].n));
  document.querySelectorAll('[data-cd]').forEach(e=>e.onclick=()=>{const k=S.cats[e.dataset.cd];
    if(cnt(k.n)){toast('Danh mục còn '+cnt(k.n)+' xe. Hãy chuyển xe sang danh mục khác trước.');return}
    if(delArm!==k.n){delArm=k.n;e.textContent='Chắc chưa?';return}
    delArm=null;S.cats.splice(e.dataset.cd,1);if(brand===k.n)brand='all';save();render();setD(true)});
}
function grid(){
  let l=S.items.filter(i=>(brand==='all'||i.brand===brand)&&[i.brand,i.name,i.series,i.color].join(' ').toLowerCase().includes(q));
  if(sort!=='new')l=l.slice().sort((a,b)=>sort==='asc'?a.price-b.price:b.price-a.price);
  $('#n').textContent=l.length+' xe';
  const v=l.slice(0,shown);
  $('#grid').innerHTML=v.length?v.map(i=>{
    const s=+i.stock||0,b=cat(i.brand)||{c:'#8B3DFF'},k=s<1?'zero':s<=2?'low':'';
    return `<article class="card ${s<1?'out':''}" data-id="${esc(i.id)}" style="--bc:${b.c};--bf:${fg(b.c)}"><div class="cb">${esc(i.brand)}</div>
    <div class="pic">${i.img?`<img src="${esc(src(i.img))}" alt="${esc(i.name)}" loading="lazy" decoding="async">`:car(i.hex)}</div>
    <div class="b"><h3>${esc(i.name)}</h3><div class="chips">${i.series?`<i>${esc(i.series)}</i>`:''}${i.color?`<i>${esc(i.color)}</i>`:''}</div>
    <p class="d">${esc(i.desc)}</p>
    <div class="row"><span class="price">${vnd(i.price)}</span><span class="stk ${k}">${s<1?'Hết hàng':s<=2?'Chỉ còn '+s:'Còn '+s}</span></div>
    ${edit?`<div class="acts"><button data-a="m" aria-label="Giảm 1">−1</button><button data-a="p" aria-label="Tăng 1">+1</button><button data-a="e">Sửa</button></div>`
    :`<button class="zl" data-a="o" ${s<1?'disabled':''}>${s<1?'Hết hàng':esc(S.shop.btn||'Đặt qua Zalo')}</button>`}</div></article>`}).join('')
    :`<div class="empty">${S.items.length?'Chưa có xe phù hợp ở mục này.':(ADMIN?'Chưa có xe nào. Bấm "Thêm xe" hoặc "Nhập nhiều xe" để bắt đầu.':'Shop đang cập nhật xe mới. Nhắn Zalo để hỏi hàng nhé.')}</div>`;
  $('#mo').style.display=l.length>shown?'':'none';
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const it=S.items.find(x=>x.id===b.closest('.card').dataset.id),a=b.dataset.a;
    if(a==='o')order(it);else if(a==='e')openEd(it);
    else{it.stock=Math.max(0,(+it.stock||0)+(a==='p'?1:-1));save();grid()}});
}
function order(i){
  const m=`Chào shop, mình muốn đặt: ${i.brand} ${i.name}${i.series?' ('+i.series+')':''}${i.color?', màu '+i.color:''}. Số lượng: 1. Giá ${vnd(i.price)}.`;
  try{navigator.clipboard.writeText(m)}catch(e){}
  toast('Đã sao chép nội dung đặt hàng. Dán vào Zalo để gửi shop.');
  window.open(zl(),'_blank','noopener');
}

function openEd(it){
  cur=it;imgPath=it?it.img:'';newBlob=null;
  $('#edt').textContent=it?'Sửa xe':'Thêm xe';$('#fx').style.display=it?'':'none';$('#fx').textContent='Xóa xe';delete $('#fx').dataset.arm;
  $('#fb').innerHTML=S.cats.map(k=>`<option>${esc(k.n)}</option>`).join('');
  const v=it||{brand:cat(brand)?brand:S.cats[0].n,name:'',series:'',color:'',hex:'#3366cc',price:'',stock:1,desc:'',img:''};
  $('#fb').value=v.brand;$('#fn').value=v.name;$('#fs').value=v.series;$('#fc').value=v.color;$('#fcol').value=v.hex||'#3366cc';
  $('#fp').value=v.price;$('#fq').value=v.stock;$('#fd').value=v.desc;$('#fi').value='';
  const p=$('#prev');p.style.display=v.img?'block':'none';p.src=v.img?src(v.img):'';
  $('#ed').showModal();
}
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{
  const k=Math.min(1,720/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(b=>{newBlob=b;imgPath='images/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';$('#prev').src=URL.createObjectURL(b);$('#prev').style.display='block'},'image/jpeg',.8)};im.src=u};
$('#fc2').onclick=()=>$('#ed').close();
$('#fx').onclick=e=>{if(!cur)return;if(!e.target.dataset.arm){e.target.dataset.arm=1;e.target.textContent='Bấm lần nữa để xóa';return}
  if(cur.img)delete B[cur.img];S.items=S.items.filter(x=>x!==cur);$('#ed').close();save();render()};
$('#f').onsubmit=()=>{
  const o={brand:$('#fb').value,name:$('#fn').value.trim(),series:$('#fs').value.trim(),color:$('#fc').value.trim(),hex:$('#fcol').value,
    price:+$('#fp').value||0,stock:Math.max(0,parseInt($('#fq').value)||0),desc:$('#fd').value.trim(),img:imgPath||''};
  if(newBlob){if(cur&&cur.img&&B[cur.img])delete B[cur.img];B[imgPath]=newBlob}
  if(cur)Object.assign(cur,o);else S.items.unshift({id:'x'+Date.now().toString(36),...o});
  save();render();
};
function openSet(){const s=S.shop;$('#sn').value=s.name;$('#sl').value=s.tag;$('#sz').value=s.zalo;$('#sb').value=s.btn||'Đặt qua Zalo';$('#sf2').value=s.foot||'';$('#sd').showModal()}
$('#sc').onclick=()=>$('#sd').close();
$('#sf').onsubmit=()=>{S.shop={name:$('#sn').value.trim(),tag:$('#sl').value.trim(),zalo:$('#sz').value.trim(),btn:$('#sb').value.trim(),foot:$('#sf2').value.trim()};document.title=S.shop.name;save();render()};
$('#bc').onclick=()=>$('#bd').close();
$('#bf').onsubmit=()=>{
  let n=0;const add=[];
  $('#bt').value.split('\n').forEach(L=>{const p=L.split(/\t|\|/).map(x=>x.trim());if(p.length<2||!p[1])return;
    let k=S.cats.find(c=>c.n.toLowerCase()===p[0].toLowerCase());
    if(!k){k={n:p[0]||'Khác',c:PAL[S.cats.length%8]};S.cats.push(k)}
    const pr=parseInt((p[4]||'').replace(/\D/g,''))||0,s=p[5]===undefined||p[5]===''?1:(parseInt(p[5])||0);
    add.push({id:'x'+Date.now().toString(36)+(n++),brand:k.n,name:p[1],series:p[2]||'',color:p[3]||'',hex:PAL[n%8],price:pr,stock:s,desc:'',img:''})});
  S.items.unshift(...add);save();render();toast('Đã thêm '+add.length+' xe.');
};

/* Xuất file để đưa lên GitHub */
function loadZip(){return window.JSZip?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exp(){
  try{
    st('Đang tạo file zip...');await loadZip();
    const z=new JSZip();z.file('data.json',JSON.stringify(S,null,1));
    Object.keys(B).forEach(p=>z.file(p,B[p]));
    const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='cap-nhat-true-xe-mo-hinh.zip';document.body.appendChild(a);a.click();a.remove();
    st('Đã tải file zip. Giải nén rồi kéo các file vào GitHub.');
  }catch(e){st('Không tạo được file zip. Kiểm tra mạng rồi thử lại.')}
}
async function clr(){
  const b=$('#clr');if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Bấm lần nữa để xóa nháp';return}
  try{await kv('del','draft')}catch(e){}
  B={};urls={};draft=false;S=SITE||JSON.parse(JSON.stringify(DEF));render();toast('Đã xóa bản nháp, đang dùng dữ liệu của web.');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dopen)setD(false)});
init();
</script>
